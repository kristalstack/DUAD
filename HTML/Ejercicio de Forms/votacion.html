<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de votación</title>
</head>

<body>

    <h1>Formulario de votación</h1>

    <p>Complete la siguiente información para registrar su voto.</p>

    <form action="confirmacion.html">

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required>

        <br><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required>

        <br><br>

        <label for="identificacion">Num. de Identificación:</label>
        <input type="text" id="identificacion" name="identificacion" required>

        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required>

        <br><br>

        <h2>Seleccione un candidato</h2>

        <input type="radio" id="candidato1" name="candidato" value="Candidato #1" required>
        <label for="candidato1">Candidato #1</label>

        <br>

        <input type="radio" id="candidato2" name="candidato" value="Candidato #2">
        <label for="candidato2">Candidato #2</label>

        <br>

        <input type="radio" id="candidato3" name="candidato" value="Candidato #3">
        <label for="candidato3">Candidato #3</label>

        <br><br>

        <button type="submit">Confirmar voto</button>

    </form>

</body>
</html>
