<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">
        <h1>Change Password</h1>

        <form id="changePasswordForm">

            <label for="currentPassword">Current Password</label>
            <input
                type="password"
                id="currentPassword"
                required
            >

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                required
            >

            <button type="submit">Change Password</button>

        </form>

        <p id="message"></p>

        <a href="profile.html">Back to Profile</a>
    </main>

    <script src="users.js"></script>

    <script>
        const form = document.getElementById("changePasswordForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const currentPassword =
                document.getElementById("currentPassword").value;

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const id = getSession();

            if (!id) {
                message.textContent = "No user is currently logged in.";
                return;
            }

            // This validation does not need an API request,
            // so it is checked first.
            if (newPassword !== confirmPassword) {
                message.textContent =
                    "The new passwords do not match.";
                return;
            }

            try {
                const user = await getUser(id);

                if (currentPassword !== user.data.password) {
                    message.textContent =
                        "The current password is incorrect.";
                    return;
                }

                await updatePassword(id, newPassword);

                message.textContent =
                    "Password updated successfully.";

                form.reset();

            } catch (error) {
                if (error.status === 404) {
                    message.textContent = "User not found.";
                    return;
                }

                message.textContent =
                    "The password could not be updated. Please try again.";
            }
        });
    </script>

</body>
</html>
